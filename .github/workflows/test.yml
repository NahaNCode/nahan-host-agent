name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/nahan-host-agent
      - run: bash -n install.sh
      - run: node deploy/test-installer.mjs
